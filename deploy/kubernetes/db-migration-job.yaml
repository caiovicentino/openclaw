apiVersion: batch/v1
kind: Job
metadata:
  name: db-migration
  namespace: openclaw
  labels:
    app.kubernetes.io/name: db-migration
    app.kubernetes.io/part-of: openclaw
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: db-migration
        app.kubernetes.io/part-of: openclaw
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: openclaw/admin-api:latest
          command:
            - npx
            - prisma
            - migrate
            - deploy
          envFrom:
            - configMapRef:
                name: openclaw-config
            - secretRef:
                name: openclaw-secrets
          resources:
            limits:
              memory: 256Mi
              cpu: 250m
            requests:
              memory: 128Mi
              cpu: 125m
