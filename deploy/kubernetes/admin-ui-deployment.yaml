apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin-ui
  namespace: openclaw
  labels:
    app.kubernetes.io/name: admin-ui
    app.kubernetes.io/part-of: openclaw
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: admin-ui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: admin-ui
        app.kubernetes.io/part-of: openclaw
    spec:
      containers:
        - name: admin-ui
          image: openclaw/admin-ui:latest
          ports:
            - containerPort: 80
              protocol: TCP
          resources:
            limits:
              memory: 128Mi
              cpu: 100m
            requests:
              memory: 64Mi
              cpu: 50m
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
