apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: openclaw
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: openclaw
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/part-of: openclaw
    spec:
      initContainers:
        - name: init-pgvector
          image: postgres:16
          command:
            - sh
            - -c
            - |
              apt-get update && apt-get install -y postgresql-16-pgvector
              cp /usr/lib/postgresql/16/lib/vector.so /shared/vector.so
              cp /usr/share/postgresql/16/extension/vector* /shared/
          volumeMounts:
            - name: pgvector-ext
              mountPath: /shared
      containers:
        - name: postgres
          image: postgres:16
          ports:
            - containerPort: 5432
              protocol: TCP
          env:
            - name: POSTGRES_DB
              value: openclaw
            - name: POSTGRES_USER
              value: openclaw
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: openclaw-secrets
                  key: SMTP_PASS
          resources:
            limits:
              memory: 1Gi
              cpu: 500m
            requests:
              memory: 512Mi
              cpu: 250m
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
            - name: pgvector-ext
              mountPath: /usr/lib/postgresql/16/lib/vector.so
              subPath: vector.so
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - openclaw
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - openclaw
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: pgvector-ext
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: openclaw
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: openclaw
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - port: 5432
      targetPort: 5432
      protocol: TCP
