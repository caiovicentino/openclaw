apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin-api
  namespace: openclaw
  labels:
    app.kubernetes.io/name: admin-api
    app.kubernetes.io/part-of: openclaw
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: admin-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: admin-api
        app.kubernetes.io/part-of: openclaw
    spec:
      containers:
        - name: admin-api
          image: openclaw/admin-api:latest
          ports:
            - containerPort: 4000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: openclaw-config
            - secretRef:
                name: openclaw-secrets
          resources:
            limits:
              memory: 256Mi
              cpu: 250m
            requests:
              memory: 128Mi
              cpu: 125m
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 4000
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 4000
            initialDelaySeconds: 5
            periodSeconds: 5
